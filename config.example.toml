# 启动后通过 WebUI 配置，或编辑 config.toml 后重载插件。
default_minutes = 20
autonomous_enabled = false

[plugin]
enabled = true
config_version = "2"

# 默认不管理任何群。取消下面的注释，替换为自己的群号。
# [[groups]]
# group_id = "987654321"
# bot_account_id = ""  # 通常留空；同群有多个机器人账号时填写
# route_scope = ""     # 通常留空；适配器有 scope 时填写相同值

[management]
# identity 使用 MaiIdentity 的管理员；local 独立使用下方名单。
# 查询失败不会自动切换到另一套名单。
source = "identity"
admin_accounts = []

[social]
enabled = false
task_name = ""       # 开启前填写 MaiBot 已有的模型任务名
max_seconds = 300   # 单次自然劝静最长时间，60–300 秒

[reply]
enabled = true
mute_text = "好，我先安静 {duration}。" # 留空不回复命令；关闭 enabled 则均不确认
