name: MaiHush checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        env:
          MAIBOT_EVIDENCE_DIR: ${{ runner.temp }}/maihush-tests
        run: python -m pytest tests -q -p no:cacheprovider -o asyncio_default_fixture_loop_scope=function
