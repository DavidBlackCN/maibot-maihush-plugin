name: MaiHush checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  unit:
    name: Unit tests (${{ matrix.os }}, Host ${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, host: '1.3.18', sdk: '2.19.0'}
          - {os: ubuntu-latest, host: '1.3.18', sdk: '2.19.0'}
          - {os: ubuntu-latest, host: '1.3.15', sdk: '2.16.0'}
          - {os: ubuntu-latest, host: '1.3.12', sdk: '2.15.0'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MAIBOT_HOST_VERSION: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies and selected SDK
        run: python -m pip install -r requirements-dev.txt maibot-plugin-sdk==${{ matrix.sdk }}
      - name: Unit tests (no model or platform calls)
        run: python -m pytest tests -q -p no:cacheprovider --basetemp "${{ runner.temp }}/maihush-tests" --junitxml "${{ runner.temp }}/maihush-evidence/unit.xml"
      - name: Natural-language request rules (no model calls)
        if: runner.os == 'Windows'
        run: python -m tools.semantic_report --output "${{ runner.temp }}/maihush-evidence/semantic.json"
      - name: Build and verify installable package
        if: runner.os == 'Windows'
        run: python tools/package.py --output "${{ runner.temp }}/maihush-evidence/MaiHush.zip" --evidence "${{ runner.temp }}/maihush-evidence/package.json"
      - name: Preserve reports and package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maihush-${{ matrix.os }}-${{ matrix.sdk }}-${{ github.sha }}
          path: ${{ runner.temp }}/maihush-evidence
