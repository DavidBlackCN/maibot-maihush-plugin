name: MaiHush offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Static and T0 (no Host, QQ or model service)
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE='1'
          $env:PYTHONPATH=(Get-Location).Path
          python -m pytest -q -p no:cacheprovider --basetemp "$env:RUNNER_TEMP/maihush-tests" --junitxml "$env:RUNNER_TEMP/t0.xml"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m tools.semantic_report --output "$env:RUNNER_TEMP/semantic.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/package.py --output "$env:RUNNER_TEMP/maihush.zip" --evidence "$env:RUNNER_TEMP/package.json"
      - name: Preserve current CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maihush-checks-${{ github.sha }}
          path: |
            ${{ runner.temp }}/t0.xml
            ${{ runner.temp }}/semantic.json
            ${{ runner.temp }}/package.json
            ${{ runner.temp }}/maihush.zip

  linux-1-3-15:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAIBOT_HOST_VERSION: '1.3.15'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --upgrade maibot-plugin-sdk==2.16.0
      - name: Linux unit regressions on deployment SDK (no platform or model calls)
        run: python -m pytest tests -q -p no:cacheprovider --junitxml "${{ runner.temp }}/linux-unit.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-1-3-15-${{ github.sha }}
          path: ${{ runner.temp }}/linux-unit.xml
